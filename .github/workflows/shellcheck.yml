name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        # The scripts target Termux's bash, which is not on the runner, so
        # check them as bash explicitly rather than trusting the shebang.
        run: shellcheck -s bash install.sh uninstall.sh src/backup.sh tools/maintenance.sh
