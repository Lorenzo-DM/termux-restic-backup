name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        # Pinned: shellcheck's info-level checks change between releases and
        # every finding fails the build, so an unpinned version breaks CI on
        # its own. The scripts target Termux's bash, which is not on the
        # runner, so check them as bash explicitly, not via the shebang.
        run: >
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0
          -s bash install.sh uninstall.sh src/backup.sh tools/maintenance.sh
